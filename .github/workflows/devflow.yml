name: DevFlow AI — Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  devflow-review:
    name: 🤖 AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DevFlow AI
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Diff saved."

      - name: Run DevFlow AI Review
        run: |
          python -m devflow.cli review --diff pr_diff.txt --output review_report.md
          cat review_report.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
